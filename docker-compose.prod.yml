# 生产编排（构建上下文为仓库根目录）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sitebuilder
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: sitebuilder
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./server/src/database/migrations/002_app_role.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./server/src/database/migrations/003_operations.sql:/docker-entrypoint-initdb.d/003.sql:ro
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USER: sitebuilder_app
      DB_PASSWORD: ${DB_APP_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-change-me}
      RENDERER_URL: http://site:3001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost/api/cdn}
    depends_on: [postgres]
    restart: unless-stopped

  site:
    build:
      context: .
      dockerfile: site/Dockerfile
    environment:
      API_BASE: http://server:3000/api
      SITE_ORIGIN: http://localhost:3001
    depends_on: [server]
    restart: unless-stopped

  editor:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    restart: unless-stopped

  # 网站装修后台（对标凡科/中企动力）
  web-admin:
    build:
      context: .
      dockerfile: web-admin/Dockerfile
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [server, site, editor, admin, web-admin]
    restart: unless-stopped

volumes:
  pgdata:
