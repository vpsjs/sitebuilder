upstream api { server server:3000; }
upstream renderer { server site:3001; }
upstream editor { server editor:80; }
upstream admin_ui { server admin:80; }
upstream web_admin_ui { server web-admin:80; }

server {
  listen 80;
  server_name _;

  # 后端 API
  location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  # 公开站点渲染器（泛域名由 Next.js middleware 处理）
  location /s/ { proxy_pass http://renderer; proxy_set_header Host $host; }
  location /mp/ { proxy_pass http://api; }
  # 装修器
  location /builder/ { proxy_pass http://editor/; }
  # 网站装修后台（凡科/中企动力式）
  location /web-admin/ { proxy_pass http://web_admin_ui/; }
  # 小程序运营后台（默认后台）
  location / { proxy_pass http://admin_ui/; }
}
